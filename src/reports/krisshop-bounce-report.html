<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KrisShop.com.au Top-5 Pages - Traffic, Devices & Bounce-Risk Review</title>
<link rel="icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>' />
<style>

  /* Standalone export: fallback values for SLICC S2 theme tokens (parent app normally injects these). */
  :root {
    --s2-bg-base: light-dark(#ffffff, #1d1d1d);
    --s2-bg-layer-1: light-dark(#f5f5f5, #292929);
    --s2-bg-layer-2: light-dark(#ececec, #323232);
    --s2-gray-25: light-dark(#fafafa, #323232);
    --s2-gray-50: light-dark(#f5f5f5, #3a3a3a);
    --s2-gray-100: light-dark(#eaeaea, #444);
    --s2-gray-200: light-dark(#e1e1e1, #555);
    --s2-gray-300: light-dark(#cacaca, #666);
    --s2-gray-500: light-dark(#8f8f8f, #a0a0a0);
    --s2-gray-700: light-dark(#4b4b4b, #cfcfcf);
    --s2-gray-900: light-dark(#1a1a1a, #f0f0f0);
    --s2-content-default: light-dark(#1a1a1a, #f0f0f0);
    --s2-accent: light-dark(#1473e6, #4a9bff);
    --s2-negative: light-dark(#d7373f, #ff6b6b);
    --s2-notice: light-dark(#e68619, #f5a623);
    --s2-positive: light-dark(#268e6c, #45c08f);
    --s2-informative: light-dark(#1473e6, #4a9bff);
    --s2-radius-s: 4px;
    --s2-radius-default: 8px;
    --s2-radius-pill: 999px;
    --s2-spacing-50: 2px;
    --s2-spacing-100: 4px;
    --s2-spacing-200: 8px;
    --s2-spacing-300: 12px;
    --s2-spacing-400: 16px;
    --s2-spacing-500: 20px;
  }

  :root { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--s2-bg-base);
    color: var(--s2-gray-800, inherit);
    padding: var(--s2-spacing-300);
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  @media (min-width: 1100px) { .wrap { max-width: 1080px; } }

  .report-header h1 {
    margin: 0 0 4px 0;
    font-size: 1.45rem;
    line-height: 1.25;
  }
  .report-sub { margin: 0; }

  .caveat {
    margin: var(--s2-spacing-300) 0;
    padding: var(--s2-spacing-200) var(--s2-spacing-300);
    border-radius: var(--s2-radius-default);
    background: color-mix(in srgb, var(--s2-notice) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--s2-notice) 35%, transparent);
    display: flex;
    gap: var(--s2-spacing-200);
    align-items: flex-start;
  }
  .caveat .sprinkle-icon { color: var(--s2-notice); flex: 0 0 auto; margin-top: 2px; }

  .section-title {
    font-weight: 600;
    font-size: 1.05rem;
    margin: var(--s2-spacing-400) 0 var(--s2-spacing-200) 0;
  }

  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s2-spacing-200); }
  @media (min-width: 700px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }

  .exec-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--s2-spacing-200); }
  .exec-item {
    display: flex; gap: var(--s2-spacing-200); align-items: flex-start;
    padding: var(--s2-spacing-200) var(--s2-spacing-300);
    background: var(--s2-bg-layer-1);
    border-radius: var(--s2-radius-default);
    border-left: 3px solid var(--s2-gray-300, color-mix(in srgb, currentColor 25%, transparent));
  }
  .exec-item.lead { border-left-color: var(--s2-negative); background: color-mix(in srgb, var(--s2-negative) 6%, var(--s2-bg-layer-1)); }
  .exec-item .sprinkle-icon { flex: 0 0 auto; margin-top: 2px; }

  .cards { display: flex; flex-direction: column; gap: var(--s2-spacing-300); }
  @media (min-width: 1100px) { .cards { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2-spacing-300); } }

  .pcard { padding: var(--s2-spacing-300); }
  .pcard__head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s2-spacing-200); margin-bottom: var(--s2-spacing-200); }
  .pcard__rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: var(--s2-radius-pill);
    background: var(--s2-accent); color: var(--s2-gray-25);
    font-weight: 700; font-size: 0.9rem; flex: 0 0 auto;
  }
  .pcard__titlerow { display: flex; gap: var(--s2-spacing-200); align-items: center; }
  .pcard__label { font-weight: 600; font-size: 1.02rem; }
  .pcard__url { font-size: 0.82rem; word-break: break-all; }
  .pcard__url a { color: var(--s2-accent); text-decoration: none; }
  .pcard__url a:hover { text-decoration: underline; }

  .shot-wrap {
    margin: var(--s2-spacing-200) 0;
    background: var(--s2-bg-layer-2);
    border-radius: var(--s2-radius-default);
    overflow: hidden;
    display: flex; justify-content: center;
    border: 1px solid color-mix(in srgb, currentColor 12%, transparent);
  }
  .shot-wrap img { display: block; }
  .shot-wrap.mobile img { max-height: 400px; width: auto; object-fit: contain; }
  .shot-wrap.desktop img { width: 100%; height: auto; object-fit: contain; }

  .subhead { font-weight: 600; font-size: 0.85rem; margin: var(--s2-spacing-300) 0 6px 0; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.75; }

  .pcard ul.bullets { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 5px; }
  .pcard ul.bullets li { font-size: 0.9rem; line-height: 1.4; }

  .obs { font-size: 0.9rem; line-height: 1.45; }

  .flag {
    font-weight: 700;
  }
  .flag--red { color: var(--s2-negative); }
  .flag--amber { color: var(--s2-notice); }

  .err-block {
    margin-top: 6px;
    background: color-mix(in srgb, var(--s2-negative) 7%, var(--s2-bg-layer-2));
    border: 1px solid color-mix(in srgb, var(--s2-negative) 30%, transparent);
    border-radius: var(--s2-radius-default);
    padding: var(--s2-spacing-200);
  }
  .err-block code {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.4;
    color: var(--s2-negative);
    margin-bottom: 6px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .err-block code:last-child { margin-bottom: 0; }

  dl.sprinkle-kv-list dt { font-size: 0.85rem; }
  dl.sprinkle-kv-list dd { font-size: 0.85rem; }

  .rec-item {
    padding: var(--s2-spacing-200) var(--s2-spacing-300);
    background: var(--s2-bg-layer-1);
    border-radius: var(--s2-radius-default);
    margin-bottom: var(--s2-spacing-200);
    display: flex; gap: var(--s2-spacing-200); align-items: flex-start;
  }
  .rec-item .pri { flex: 0 0 auto; }
  .rec-item .rec-body { font-size: 0.92rem; line-height: 1.45; }
</style>

  var REPORT = {"domain":"www.krisshop.com.au","window":"2026-05-13 to 2026-06-11 (last 30 days)","trafficSource":"all traffic","totalPageViewsDomain":16400,"generated":"2026-06-12","dataCaveat":"Low absolute RUM volume (16,400 total page views, 1-in-100+ sampled) and the site is flagged 'AUSTRALIA BETA'. Treat percentages as directional, not statistically tight. Some pages show 0 visits/bounces because nearly all arrivals follow internal links (not session starts).","pages":[{"rank":1,"url":"https://www.krisshop.com.au/en/store/launch-promo","label":"Launch Promo (Earn More Miles)","pageViews":2200,"shareOfDomain":"13.4%","device":{"dominant":"mobile","mobile":"72.7%","desktop":"27.3%","topDetail":"mobile:ios:webkit 50.0%"},"visits":900,"bounces":600,"bounceRate":"66.7%","engagementRate":"77.3%","cwv":{"lcp":"1.15s","cls":"N/A","inp":"N/A"},"errorEvents":200,"errorRate":"9.1%","screenshotDevice":"mobile","screenshotObservation":"A browser push-notification permission prompt ('KrisShop AU would like to send push notifications', powered by PushEngage) fires on load and covers the top of the page. Below it the promo renders well: hero 'Now in Australia: Earn More Miles on Us', clear value prop (500 bonus KrisFlyer miles, min spend AUD75), categories and a product grid.","concerns":["Push-notification permission prompt fires on first paint, overlaying the page before the user has engaged - a well-known bounce/annoyance trigger, especially on mobile (73% of this page's traffic).","Promo dates read '13-31 May' - the campaign window largely predates this analysis period, so this page's traffic may be tailing off and the 66.7% bounce partly reflects an expiring offer.","LCP 1.15s is good; content quality is fine - the main issue is the interruptive permission prompt."],"severity":"Medium"},{"rank":2,"url":"https://www.krisshop.com.au/en","label":"Homepage","pageViews":1700,"shareOfDomain":"10.4%","device":{"dominant":"desktop","mobile":"17.6%","desktop":"82.4%","topDetail":"desktop:windows:blink 64.7%"},"visits":700,"bounces":200,"bounceRate":"28.6%","engagementRate":"100.0%","cwv":{"lcp":"1.72s","cls":"0.268","inp":"0.10s"},"errorEvents":500,"errorRate":"29.4%","screenshotDevice":"desktop","screenshotObservation":"Double interstitial on first load: the push-notification permission prompt AND a large 'Flying Soon? You're currently shopping Home Delivery for Australia / Visit Global Site' modal covering the hero. Two overlays appear before the user sees content.","concerns":["CLS p75 of 0.268 is POOR (Google threshold for 'poor' is >0.25) - likely driven by late-loading overlays plus the hero/carousel shifting after paint. The most fixable bounce signal on this page.","Two stacked interstitials (push prompt + 'Visit Global Site' geo modal) on first paint create immediate friction before any value is shown.","29.4% error rate is high for a homepage and warrants an error-clustering pass.","On the positive side, bounce is a healthy 28.6% and engagement is high - the homepage's content/navigation work; the issues are layout stability and the overlay stack."],"severity":"High"},{"rank":3,"url":"https://www.krisshop.com.au/en/search/product","label":"Product Search Results","pageViews":1300,"shareOfDomain":"7.9%","device":{"dominant":"desktop (slight)","mobile":"46.2%","desktop":"53.8%","topDetail":"desktop:mac 38.5%"},"visits":0,"bounces":0,"bounceRate":"n/a (internal-link arrivals)","engagementRate":"84.6%","cwv":{"lcp":"4.56s","cls":"N/A","inp":"N/A"},"errorEvents":100,"errorRate":"7.7%","screenshotDevice":"desktop","screenshotObservation":"Clean product-results grid: category filters in left rail, dual pricing (AUD + KrisFlyer miles), '34943 products found', sort options. The push-notification prompt sits at the top. Renders correctly.","concerns":["LCP p75 of 4.56s is POOR (>4.0s) on a product-listing page - slow results directly hurt browse-to-purchase and are a strong bounce/abandon driver for shoppers.","Nearly all arrivals are internal-link navigations (0 recorded visits/session-starts), so this is a mid-funnel browse page; speeding it up protects conversions already in motion.","Push prompt present here too - consistent site-wide interruption."],"severity":"High"},{"rank":4,"url":"https://www.krisshop.com.au/en/cart","label":"Shopping Bag (Cart)","pageViews":800,"shareOfDomain":"4.9%","device":{"dominant":"mobile","mobile":"62.5%","desktop":"37.5%","topDetail":"mobile:ios:webkit 37.5%"},"visits":0,"bounces":0,"bounceRate":"n/a (internal-link arrivals)","engagementRate":"100.0%","cwv":{"lcp":"N/A","cls":"N/A","inp":"N/A"},"errorEvents":700,"errorRate":"87.5%","screenshotDevice":"mobile","screenshotObservation":"Empty-cart state ('There are no items in your shopping bag'), the push-notification prompt at the top, and a 'Stay Updated' newsletter signup form lower down. Renders, but see the error drill-down.","errorDetail":["TypeError: Cannot read properties of null (reading 'checked') - in clientlib-site...min.js; code reads .checked on a null element (a checkbox/radio missing for an empty cart or a guest).","TypeError: undefined is not an object (evaluating 'e.offset().top') - jQuery .offset() called on a missing element (scroll/positioning code targeting an element that isn't present)."],"concerns":["CRITICAL: ~87.5% of cart loads throw JavaScript TypeErrors from KrisShop's OWN clientlib (clientlib-site...min.js). Broken JS at the most conversion-critical step risks broken interactivity (e.g. quantity, voucher, scroll behaviour) and abandoned purchases.","Errors are null-guard failures: code assumes elements exist that are absent for empty carts / guests. Add existence checks before reading .checked and calling .offset().","62.5% mobile (iOS) - verify the cart flow specifically on iOS Safari where most cart traffic lands."],"severity":"Critical"},{"rank":5,"url":"https://www.krisshop.com.au/en/brands.html","label":"Brands Directory","pageViews":600,"shareOfDomain":"3.7%","device":{"dominant":"even split","mobile":"50.0%","desktop":"50.0%","topDetail":"mobile:ios 33.3% / desktop:mac 33.3%"},"visits":0,"bounces":0,"bounceRate":"n/a (internal-link arrivals)","engagementRate":"100.0%","cwv":{"lcp":"N/A","cls":"N/A","inp":"N/A"},"errorEvents":200,"errorRate":"33.3%","screenshotDevice":"desktop","screenshotObservation":"Clean A-Z brand directory with alphabetical jump-nav and brand listings in columns. Breadcrumb (Home > Brands). The push-notification prompt sits at the top.","concerns":["33.3% error rate is high for a simple directory page - likely the same shared clientlib issues seen elsewhere; include in the error-clustering pass.","Push prompt present again - site-wide pattern.","Content and layout are otherwise clean and usable; engagement is high."],"severity":"Medium (errors)"}],"crossCuttingFindings":["A browser push-notification permission prompt (PushEngage) fires on FIRST PAINT on every one of the top 5 pages, overlaying content before the user has engaged. This is a textbook bounce/annoyance driver and the single most repeatable issue across the site - defer it until after meaningful engagement (e.g. scroll, add-to-cart, second pageview).","The cart page throws JavaScript TypeErrors on ~88% of loads, from KrisShop's own clientlib (null-guard failures on .checked and .offset()). Broken JS at the cart is the most damaging finding for conversion and should be the top fix.","Error rates are elevated site-wide (homepage 29%, brands 33%, cart 88%), all pointing at the shared clientlib-site script - a single error-clustering / fix pass would likely lift multiple pages at once.","Performance is mostly good (LCP 1.15-1.72s on promo/home) EXCEPT the product search results page at 4.56s LCP (poor) and the homepage CLS at 0.268 (poor). Layout stability and search-results speed are the two performance levers.","Caveat: low absolute traffic (16,400 views, heavily sampled) and a 'BETA' site - findings are directional. The screenshot-level issues (interstitials, broken cart JS, poor CLS) are concrete regardless of sample size."]};


  function pct(s){ var m = String(s).match(/([\d.]+)\s*%/); return m ? parseFloat(m[1]) : NaN; }
  function secs(s){ var m = String(s).match(/([\d.]+)\s*s/); return m ? parseFloat(m[1]) : NaN; }

  // Subline + caveat
  document.getElementById('subline').textContent =
    REPORT.domain + ' \u2014 window ' + REPORT.window + ' \u2014 ' + REPORT.trafficSource;
  document.getElementById('caveat').innerHTML =
    '<strong>Data caveat:</strong> ' + REPORT.dataCaveat;

  // Executive summary
  var exec = document.getElementById('exec');
  REPORT.crossCuttingFindings.forEach(function(f, i){
    var li = document.createElement('li');
    li.className = 'exec-item' + (i < 2 ? ' lead' : '');
    var icon = i < 2 ? 'alert-octagon' : 'info';
    var col = i < 2 ? 'var(--s2-negative)' : 'var(--s2-accent)';
    li.innerHTML = '<i data-lucide="' + icon + '" class="sprinkle-icon sprinkle-icon--m" style="color:' + col + '"></i>' +
      '<span class="sprinkle-body" style="font-size:0.92rem;line-height:1.45">' + f + '</span>';
    exec.appendChild(li);
  });

  // Severity badge mapping
  function sevBadge(sev){
    var s = sev.toLowerCase();
    var cls, label = sev;
    if (s.indexOf('critical') === 0) cls = 'sprinkle-badge--negative';
    else if (s.indexOf('high') === 0) cls = 'sprinkle-badge--notice';
    else cls = 'sprinkle-badge--informative sprinkle-badge--subtle';
    return '<span class="sprinkle-badge ' + cls + '">' + label + '</span>';
  }

  // Metric flagging
  function bounceFlag(v){ var n = pct(v); if (isNaN(n)) return v; return n >= 60 ? '<span class="flag flag--amber">'+v+'</span>' : v; }
  function errFlag(v){ var n = pct(v); if (isNaN(n)) return v; if (n>=50) return '<span class="flag flag--red">'+v+'</span>'; if (n>=15) return '<span class="flag flag--amber">'+v+'</span>'; return v; }
  function lcpFlag(v){ var n = secs(v); if (isNaN(n)) return v; if (n>4) return '<span class="flag flag--red">'+v+'</span>'; if (n>2.5) return '<span class="flag flag--amber">'+v+'</span>'; return v; }
  function clsFlag(v){ var n = (String(v).match(/^[\d.]+$/)) ? parseFloat(v) : NaN; if (isNaN(n)) return v; if (n>0.25) return '<span class="flag flag--red">'+v+'</span>'; if (n>0.1) return '<span class="flag flag--amber">'+v+'</span>'; return v; }

  var cards = document.getElementById('cards');
  REPORT.pages.forEach(function(p){
    var card = document.createElement('div');
    card.className = 'sprinkle-card pcard';
    var isMobile = (p.screenshotDevice === 'mobile');
    var shotKey = 'p' + p.rank;

    var cwv = p.cwv;
    var cwvStr = 'LCP ' + lcpFlag(cwv.lcp) + ' &middot; CLS ' + clsFlag(cwv.cls) + ' &middot; INP ' + (cwv.inp || 'N/A');

    var concerns = p.concerns.map(function(c){ return '<li>' + c + '</li>'; }).join('');

    var errDetail = '';
    if (p.errorDetail && p.errorDetail.length) {
      errDetail = '<div class="subhead">Error detail (cart clientlib TypeErrors)</div>' +
        '<div class="err-block">' +
        p.errorDetail.map(function(e){ return '<code>' + e.replace(/</g,'&lt;') + '</code>'; }).join('') +
        '</div>';
    }

    card.innerHTML =
      '<div class="pcard__head">' +
        '<div class="pcard__titlerow">' +
          '<span class="pcard__rank">' + p.rank + '</span>' +
          '<div>' +
            '<div class="pcard__label">' + p.label + '</div>' +
            '<div class="pcard__url"><a href="' + p.url + '" target="_blank" rel="noopener">' + p.url + '</a></div>' +
          '</div>' +
        '</div>' +
        sevBadge(p.severity) +
      '</div>' +

      '<div class="shot-wrap ' + (isMobile ? 'mobile' : 'desktop') + '">' +
        '<img src="' + SHOT_DATA[shotKey] + '" alt="' + p.label + ' above-the-fold screenshot" />' +
      '</div>' +

      '<dl class="sprinkle-kv-list">' +
        '<dt>Page views</dt><dd>' + p.pageViews.toLocaleString() + ' (' + p.shareOfDomain + ' of domain)</dd>' +
        '<dt>Dominant device</dt><dd>' + p.device.dominant + ' \u2014 m ' + p.device.mobile + ' / d ' + p.device.desktop + '</dd>' +
        '<dt>Bounce rate</dt><dd>' + bounceFlag(p.bounceRate) + '</dd>' +
        '<dt>Engagement rate</dt><dd>' + p.engagementRate + '</dd>' +
        '<dt>Core Web Vitals (p75)</dt><dd>' + cwvStr + '</dd>' +
        '<dt>Error rate</dt><dd>' + errFlag(p.errorRate) + ' (' + p.errorEvents.toLocaleString() + ' events)</dd>' +
      '</dl>' +

      '<div class="subhead">What the screenshot shows</div>' +
      '<div class="obs sprinkle-body">' + p.screenshotObservation + '</div>' +

      errDetail +

      '<div class="subhead">Concerns</div>' +
      '<ul class="bullets sprinkle-body">' + concerns + '</ul>';

    cards.appendChild(card);
  });

  // Recommendations
  var recs = [
    {pri:'P0', cls:'sprinkle-badge--negative', text:'<strong>Fix the cart page JS errors.</strong> Add null/existence guards before reading <code>.checked</code> and calling jQuery <code>.offset()</code> in <code>clientlib-site...js</code>. ~88% of cart loads error; this is the most conversion-critical page. Test on iOS Safari (most cart traffic).'},
    {pri:'P0', cls:'sprinkle-badge--negative', text:'<strong>Defer the push-notification permission prompt.</strong> Do not fire it on first paint on every page; trigger after meaningful engagement (scroll, add-to-cart, or a return visit). It is the most repeatable site-wide friction.'},
    {pri:'P1', cls:'sprinkle-badge--notice', text:'<strong>Fix homepage layout stability (CLS 0.268 = poor).</strong> Reserve space for the late-loading overlays/hero carousel; and reconsider stacking the \'Visit Global Site\' geo modal on top of the push prompt.'},
    {pri:'P1', cls:'sprinkle-badge--notice', text:'<strong>Improve product search results LCP (4.56s = poor).</strong> It\'s a mid-funnel browse page; slow results hurt conversion-in-motion.'},

    {pri:'Note', cls:'sprinkle-badge--informative sprinkle-badge--subtle', text:'<strong>Data caveat:</strong> low-volume BETA site, percentages directional; the screenshot-level issues (interstitials, broken cart JS, poor CLS) are concrete regardless of sample size.'}
  ];
  var recBox = document.getElementById('recs');
  recs.forEach(function(r){
